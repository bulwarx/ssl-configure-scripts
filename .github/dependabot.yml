version: 2
updates:
  # Rust dependencies for the Tauri app
  - package-ecosystem: cargo
    directory: /tauri-app/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for all non-major bumps to keep review noise low.
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the build/release workflow
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
