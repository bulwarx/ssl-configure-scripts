name: Tauri Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least-privilege default. The release job overrides this with `contents: write`.
permissions:
  contents: read

jobs:
  build:
    # Explicit name keeps the check context stable as `build (<os>)` regardless
    # of other matrix fields — required by branch protection on main.
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # Standalone executable, no installer — needs WebView2 on the host
            # (already present on Win10 1903+ and Win11).
            build-args: ''
            artifact-path: 'tauri-app/src-tauri/target/release/ssl-configurator.exe'
          - os: macos-latest
            # Build only the .app (no .dmg). Dragging a .dmg to /Applications
            # needs admin; the zipped .app runs from anywhere without elevation.
            build-args: '--bundles app'
            artifact-path: 'tauri-app/src-tauri/ssl-configurator-macos.zip'
          - os: ubuntu-22.04
            build-args: ''
            artifact-path: 'tauri-app/src-tauri/target/release/bundle/appimage/*.AppImage'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tauri-app/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Build Tauri app
        working-directory: tauri-app
        run: tauri build ${{ matrix.build-args }}

      - name: Package macOS .app (zip, self-contained)
        if: runner.os == 'macOS'
        working-directory: tauri-app/src-tauri/target/release/bundle/macos
        run: |
          app=$(ls -d *.app | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$app" "$GITHUB_WORKSPACE/tauri-app/src-tauri/ssl-configurator-macos.zip"

      - name: Upload artifacts
        # On pull requests this job is only a build check — no need to store binaries.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ssl-configurator-${{ runner.os }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
